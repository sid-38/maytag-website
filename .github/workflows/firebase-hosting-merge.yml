# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Node FIRST and upgrade to Node 22
      - uses: actions/setup-node@v4
        with:
          # 22.23.0 has a keep-alive bug that causes Firebase release API calls to
          # fail with "supplied version is the current active version" on retry.
          node-version: 22.23.1

      # 2. Setup pnpm SECOND (it will now successfully find Node 22)
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false # Disables implicit install before cache config

      # 3. Enable caching (Must be declared after both Node and pnpm are ready)
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: 'pnpm'

      - run: pnpm install
      - run: pnpm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAYTAG_6D353 }}
          channelId: live
          projectId: maytag-6d353
